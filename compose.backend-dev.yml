# Opt-in only: normal desktop users pull the backend image from compose.yml.
services:
  api:
    image: sunmark-server-dev:local
    build:
      context: ${SUNMARK_SERVER_PATH:-../sunmark-server}
      target: runtime
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
  migrate:
    image: sunmark-server-dev:local
