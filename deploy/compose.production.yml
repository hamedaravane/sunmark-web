name: sunmark-production

x-runtime: &runtime
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  logging:
    driver: local
    options: { max-size: 10m, max-file: '3' }

x-api: &api
  <<: *runtime
  image: ${API_IMAGE:?Set an immutable backend image digest}
  entrypoint: [/bin/sh, /opt/sunmark/api-entrypoint.sh]
  environment:
    NODE_ENV: production
    PORT: '3000'
    NODE_OPTIONS: --max-old-space-size=320
    CORS_ORIGINS: https://${DOMAIN:?Set the public hostname}
    DOCS_ENABLED: 'false'
    SESSION_COOKIE_SECURE: 'true'
  volumes:
    - ./api-entrypoint.sh:/opt/sunmark/api-entrypoint.sh:ro
  secrets: [database-url]
  networks: [database, application]
  read_only: true
  tmpfs: ['/tmp:size=32m,mode=1777']
  cap_drop: [ALL]
  mem_limit: 512m
  cpus: 0.80
  pids_limit: 128

services:
  postgres:
    <<: *runtime
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: sunmark_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password, app-password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ${SUNMARK_CONFIG_DIR:-/etc/sunmark}/postgres-init.sh:/docker-entrypoint-initdb.d/10-sunmark.sh:ro
    networks: [database]
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777', '/var/run/postgresql:size=8m,mode=3775']
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    healthcheck:
      test:
        [
          CMD-SHELL,
          'test -f "$$PGDATA/.sunmark-initialized" && pg_isready -U sunmark_admin -d postgres',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    <<: *api
    profiles: [tools]
    restart: 'no'
    command: [node, migrate.mjs]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *api
    command: [node, dist/main.js]
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  web:
    <<: *runtime
    image: ${WEB_IMAGE:?Set an immutable frontend image digest}
    environment:
      API_UPSTREAM: http://api:3000
      NODE_OPTIONS: --max-old-space-size=80
    networks: [application, edge]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "Promise.all([fetch('http://127.0.0.1:8080/'),fetch('http://127.0.0.1:8080/api/v1/health/ready')]).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  caddy:
    <<: *runtime
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      DOMAIN: ${DOMAIN:?Set the public hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact}
      NO_PROXY: localhost,127.0.0.1,web,api,postgres
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      web: { condition: service_healthy }
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -Y, 'off', -q, -O, /dev/null, 'http://127.0.0.1:8081/healthz']
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  database: { internal: true }
  application: { internal: true }
  edge: {}
volumes:
  postgres-data: {}
  caddy-data: {}
  caddy-config: {}
secrets:
  postgres-password:
    file: ${SUNMARK_CONFIG_DIR:-/etc/sunmark}/secrets/postgres-password
  app-password:
    file: ${SUNMARK_CONFIG_DIR:-/etc/sunmark}/secrets/app-password
  database-url:
    file: ${SUNMARK_CONFIG_DIR:-/etc/sunmark}/secrets/database-url
